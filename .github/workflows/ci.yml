name: KRONA VAULT™ — Continuous Integration & Security Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build, Audit, Unit, Integration & Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js v22 LTS (Jod)
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Strict Typecheck
        run: npm run typecheck

      - name: 🧪 Unit & Integration Tests (Engine, Ledger & Cripto TOTP)
        run: npm test

      - name: 🎭 Install Playwright Chromium Browser & Dependencies
        run: npx playwright install --with-deps chromium

      - name: 🚀 Run Playwright End-to-End Test Suites (11 Portals & Offline Mode)
        run: npm run test:e2e

      - name: 📊 Upload Playwright Test Report (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
